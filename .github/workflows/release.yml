name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build tagged source
    uses: ./.github/workflows/ci.yml
    with:
      expected-tag: ${{ github.ref_name }}

  publish:
    name: Publish Windows release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: everytree-windows-x64
          path: dist

      - name: Verify checksum and publish release
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          package="everytree-${VERSION}-windows-x64.zip"
          sha256sum --check "${package}.sha256"
          args=(--repo "$GH_REPO" --verify-tag --title "everytree ${RELEASE_TAG}" --generate-notes)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$package" "${package}.sha256" "${args[@]}"
