[package]
name = "everytree"
version = "0.3.6"
edition = "2024"
description = "A GPU-rendered disk explorer powered by the Everything index"
license = "MIT"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
libloading = "0.8.9"
bytemuck = { version = "1.25.0", features = ["derive"] }

[dev-dependencies]
pollster = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "wgsl"] }

[profile.release]
lto = "thin"
codegen-units = 1
